openapi: 3.1.0
info:
  title: P14 Knowledge Search API
  description: 'Search across organizational knowledge with verifiable citations (AI
    Puzzle piece P14). Errors use RFC 9457 problem+json. Authentication: X-API-Key
    header.'
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - meta
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/version:
    get:
      tags:
      - meta
      summary: Version
      operationId: version_v1_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Versions'
  /v1/search:
    post:
      tags:
      - search
      summary: Search
      operationId: search_v1_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents:
    post:
      tags:
      - documents
      summary: Ingest
      description: Ingest a document. It stays NOT searchable until an owner approves
        it (human oversight).
      operationId: ingest_v1_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestDocument'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents/{document_id}/approve:
    post:
      tags:
      - documents
      summary: Approve
      description: 'Owner approval: indexes the current version and makes it searchable.'
      operationId: approve_v1_documents__document_id__approve_post
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '413':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request Entity Too Large
        '415':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported Media Type
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '503':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
  /v1/documents/{document_id}:
    get:
      tags:
      - documents
      summary: Get Document
      operationId: get_document_v1_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfo'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '413':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request Entity Too Large
        '415':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported Media Type
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '503':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
  /v1/passages/{passage_id}:
    get:
      tags:
      - documents
      summary: Get Passage
      description: Resolve a cited passage, also from superseded versions (active=false).
      operationId: get_passage_v1_passages__passage_id__get
      parameters:
      - name: passage_id
        in: path
        required: true
        schema:
          type: string
          title: Passage Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassageInfo'
        '401':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unauthorized
        '403':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Forbidden
        '404':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '413':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request Entity Too Large
        '415':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unsupported Media Type
        '422':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Unprocessable Entity
        '503':
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Service Unavailable
  /v1/feedback:
    post:
      tags:
      - feedback
      summary: Feedback
      description: Store the user's judgement on a returned passage (operator's final
        decision, for traceability).
      operationId: feedback_v1_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResult'
        '401':
          description: Unauthorized
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not Found
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Request Entity Too Large
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported Media Type
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          content:
            application/problem+json: {}
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    AccessLevel:
      type: string
      enum:
      - public
      - internal
      - restricted
      title: AccessLevel
    ApproveRequest:
      properties:
        note:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Note
          description: Why the owner approves (stored in approval_log).
      type: object
      title: ApproveRequest
    Citation:
      properties:
        document_id:
          type: string
          title: Document Id
        document_version:
          type: string
          title: Document Version
        title:
          type: string
          title: Title
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
          description: Section heading, e.g. 'Art. 18'.
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
          description: 1-based page for paginated formats (PDF).
        char_start:
          type: integer
          title: Char Start
          description: Offset in the parsed document text.
        char_end:
          type: integer
          title: Char End
        source_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Url
      type: object
      required:
      - document_id
      - document_version
      - title
      - char_start
      - char_end
      title: Citation
    DocumentInfo:
      properties:
        document_id:
          type: string
          title: Document Id
        source_id:
          type: string
          title: Source Id
        external_id:
          type: string
          title: External Id
        title:
          type: string
          title: Title
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        owner:
          type: string
          title: Owner
        source_piece:
          type: string
          title: Source Piece
        validated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Validated By
        synthetic:
          type: boolean
          title: Synthetic
        llm_generated:
          type: boolean
          title: Llm Generated
        status:
          type: string
          enum:
          - pending
          - approved
          title: Status
        current_version:
          type: string
          title: Current Version
        versions:
          items:
            type: string
          type: array
          title: Versions
      type: object
      required:
      - document_id
      - source_id
      - external_id
      - title
      - access_level
      - metadata
      - owner
      - source_piece
      - validated_by
      - synthetic
      - llm_generated
      - status
      - current_version
      - versions
      title: DocumentInfo
    DocumentMetadata:
      properties:
        office:
          type: string
          maxLength: 40
          minLength: 1
          title: Office
          description: Owning office, e.g. hr, it, legal.
        type:
          type: string
          maxLength: 40
          minLength: 1
          title: Type
          description: Document type, e.g. legislation, procedure, faq.
        author:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Author
        date:
          anyOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          - type: 'null'
          title: Date
          description: ISO date (YYYY-MM-DD) of the document.
        project:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Project
        source_url:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Source Url
          description: Where the original was obtained.
      additionalProperties: false
      type: object
      required:
      - office
      - type
      title: DocumentMetadata
    Evidence:
      properties:
        score:
          type: number
          title: Score
          description: Score of the system that produced the ranking (RRF for hybrid).
        rank:
          type: integer
          minimum: 1.0
          title: Rank
        retriever_ranks:
          additionalProperties:
            anyOf:
            - type: integer
            - type: 'null'
          type: object
          title: Retriever Ranks
          description: Rank in each retriever (bm25, dense); null = not retrieved.
        retriever_scores:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          type: object
          title: Retriever Scores
      type: object
      required:
      - score
      - rank
      - retriever_ranks
      - retriever_scores
      title: Evidence
      description: Ranking evidence. Scores are NOT calibrated probabilities and must
        not be read as confidence.
    FeedbackJudgement:
      type: string
      enum:
      - useful
      - not_useful
      - wrong_source
      title: FeedbackJudgement
    FeedbackRequest:
      properties:
        request_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Request Id
        passage_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Passage Id
        judgement:
          $ref: '#/components/schemas/FeedbackJudgement'
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
      additionalProperties: false
      type: object
      required:
      - request_id
      - passage_id
      - judgement
      title: FeedbackRequest
    FeedbackResult:
      properties:
        feedback_id:
          type: integer
          title: Feedback Id
        stored:
          type: boolean
          title: Stored
          default: true
      type: object
      required:
      - feedback_id
      title: FeedbackResult
    FileContent:
      properties:
        filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Filename
        media_type:
          type: string
          enum:
          - application/pdf
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - text/html
          - text/plain
          title: Media Type
        content_base64:
          type: string
          title: Content Base64
          description: File bytes, base64-encoded.
      additionalProperties: false
      type: object
      required:
      - filename
      - media_type
      - content_base64
      title: FileContent
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: ok | degraded
        components:
          additionalProperties:
            type: string
          type: object
          title: Components
      type: object
      required:
      - status
      - components
      title: HealthResponse
    IngestDocument:
      properties:
        source_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          title: Source Id
          description: Source/repository identifier.
        external_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
          title: External Id
          description: Id of the document in its source.
        title:
          type: string
          maxLength: 500
          minLength: 1
          title: Title
        file:
          $ref: '#/components/schemas/FileContent'
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        owner:
          type: string
          maxLength: 200
          minLength: 1
          title: Owner
          description: Accountable owner (a role, not a person).
        source_piece:
          type: string
          pattern: ^P\d{2}$
          title: Source Piece
          description: Puzzle piece that produced the document.
          default: P14
        validated_by:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Validated By
          description: Expert validation (P25 knowledge cards).
        synthetic:
          type: boolean
          title: Synthetic
          default: false
        llm_generated:
          type: boolean
          title: Llm Generated
          default: false
      additionalProperties: false
      type: object
      required:
      - source_id
      - external_id
      - title
      - file
      - metadata
      - access_level
      - owner
      title: IngestDocument
      description: Inbound format shared by every producer (admin upload, P11, P15,
        P25).
    IngestResult:
      properties:
        document_id:
          type: string
          title: Document Id
        document_version:
          type: string
          title: Document Version
        status:
          type: string
          enum:
          - pending
          - approved
          title: Status
        passages:
          type: integer
          title: Passages
        unchanged:
          type: boolean
          title: Unchanged
          description: True when the same version was already ingested.
          default: false
      type: object
      required:
      - document_id
      - document_version
      - status
      - passages
      title: IngestResult
    Passage:
      properties:
        passage_id:
          type: string
          title: Passage Id
        text:
          type: string
          title: Text
        citation:
          $ref: '#/components/schemas/Citation'
        evidence:
          $ref: '#/components/schemas/Evidence'
      type: object
      required:
      - passage_id
      - text
      - citation
      - evidence
      title: Passage
    PassageInfo:
      properties:
        passage_id:
          type: string
          title: Passage Id
        text:
          type: string
          title: Text
        citation:
          $ref: '#/components/schemas/Citation'
        active:
          type: boolean
          title: Active
          description: False when the passage belongs to a superseded document version.
      type: object
      required:
      - passage_id
      - text
      - citation
      - active
      title: PassageInfo
    Problem:
      properties:
        type:
          type: string
          title: Type
          default: about:blank
        title:
          type: string
          title: Title
        status:
          type: integer
          title: Status
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
      type: object
      required:
      - title
      - status
      title: Problem
      description: RFC 9457 problem details.
    ResultDocument:
      properties:
        document_id:
          type: string
          title: Document Id
        document_version:
          type: string
          title: Document Version
        title:
          type: string
          title: Title
        access_level:
          $ref: '#/components/schemas/AccessLevel'
        metadata:
          $ref: '#/components/schemas/DocumentMetadata'
        owner:
          type: string
          title: Owner
        synthetic:
          type: boolean
          title: Synthetic
        llm_generated:
          type: boolean
          title: Llm Generated
        best_rank:
          type: integer
          title: Best Rank
        passages:
          items:
            $ref: '#/components/schemas/Passage'
          type: array
          title: Passages
      type: object
      required:
      - document_id
      - document_version
      - title
      - access_level
      - metadata
      - owner
      - synthetic
      - llm_generated
      - best_rank
      - passages
      title: ResultDocument
    SearchFilters:
      properties:
        office:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Office
        type:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Type
        source_id:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Source Id
      additionalProperties: false
      type: object
      title: SearchFilters
    SearchRequest:
      properties:
        query:
          type: string
          maxLength: 1000
          minLength: 1
          title: Query
        top_k:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Top K
          description: Number of passages to return.
          default: 10
        filters:
          anyOf:
          - $ref: '#/components/schemas/SearchFilters'
          - type: 'null'
        with_summary:
          type: boolean
          title: With Summary
          default: true
      additionalProperties: false
      type: object
      required:
      - query
      title: SearchRequest
    SearchResponse:
      properties:
        request_id:
          type: string
          title: Request Id
        query:
          type: string
          title: Query
        system:
          type: string
          title: System
          description: Retrieval system that produced the shown ranking (B0, S1, S2).
        results:
          items:
            $ref: '#/components/schemas/ResultDocument'
          type: array
          title: Results
          description: Documents ranked by their best passage.
        insufficient_evidence:
          type: boolean
          title: Insufficient Evidence
        summary:
          anyOf:
          - $ref: '#/components/schemas/Summary'
          - type: 'null'
        versions:
          $ref: '#/components/schemas/Versions'
      type: object
      required:
      - request_id
      - query
      - system
      - results
      - insufficient_evidence
      - summary
      - versions
      title: SearchResponse
    Summary:
      properties:
        method:
          type: string
          const: extractive
          title: Method
          default: extractive
        generated:
          type: boolean
          title: Generated
          description: 'False: sentences are copied verbatim from passages.'
          default: false
        sentences:
          items:
            $ref: '#/components/schemas/SummarySentence'
          type: array
          title: Sentences
      type: object
      required:
      - sentences
      title: Summary
    SummarySentence:
      properties:
        text:
          type: string
          title: Text
        passage_id:
          type: string
          title: Passage Id
      type: object
      required:
      - text
      - passage_id
      title: SummarySentence
    Versions:
      properties:
        pipeline_version:
          type: string
          title: Pipeline Version
        chunker_version:
          type: string
          title: Chunker Version
        embedding_model:
          type: string
          title: Embedding Model
        reranker_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Reranker Model
        index_snapshot_id:
          anyOf:
          - type: string
