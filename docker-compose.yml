services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: p14-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      # Named volume: Qdrant advises against Windows bind mounts for its storage.
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
