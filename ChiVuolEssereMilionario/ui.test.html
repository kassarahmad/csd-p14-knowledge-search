<!doctype html><meta charset="utf-8"><title>Test interfaccia</title><body data-result="FAIL"><iframe src="index.html"></iframe><pre id="result">FAIL: interfaccia non disponibile</pre><script>
const frame=document.querySelector('iframe');
frame.onload=()=>{try {
 const d=frame.contentDocument;
 const check=(v,m)=>{if(!v)throw Error(m)};
 check(d.querySelectorAll('.answer').length===4,'Servono quattro risposte');
 d.querySelector('.answer').click();
 check(d.querySelector('#message').textContent.includes('Esatto'),'Risposta corretta');
 d.querySelector('#next').click();
 check(d.querySelector('#progress').textContent.includes('2 / 15'),'Seconda domanda');
 d.querySelector('#retire').click();
 check(d.querySelector('#message').textContent.includes('100'),'Ritiro con premio');
 d.querySelector('#restart').click();
 check(d.querySelector('#progress').textContent.includes('1 / 15'),'Nuova partita');
 d.querySelectorAll('.answer')[1].click();
 check(d.querySelector('#message').textContent.includes('Sbagliato'),'Risposta errata');
 document.body.dataset.result='PASS';document.querySelector('#result').textContent='PASS: risposta, avanzamento, ritiro, nuova partita, errore';
}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message}};
</script>
